const ASSETS = {};  // name -> Sprite, filled before the game starts

function loadSprite(base64) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(Sprite.fromImage(img));
    img.onerror = () => reject(new Error("Sprite: couldn't decode PNG"));
    img.src = 'data:image/png;base64,' + base64;
  });
}

// =============================================================================
// platform/WebApp - the only part of the page that talks to the browser:
// canvas, keyboard, audio device and the fixed-timestep main loop.
// =============================================================================

const STEP_SECONDS = 1 / 60;

function mapKey(code) {
  switch (code) {
    case 'ArrowUp':
    case 'KeyW': return Key.Up;
    case 'ArrowDown':
    case 'KeyS': return Key.Down;
    case 'ArrowLeft':
    case 'KeyA': return Key.Left;
    case 'ArrowRight':
    case 'KeyD': return Key.Right;
    case 'KeyZ': return Key.A;
    case 'KeyX': return Key.B;
    case 'Enter':
    case 'NumpadEnter': return Key.Start;
    default: return null;
  }
}

class WebApp {
  constructor(canvasEl) {
    this.el = canvasEl;
    this.ctx = canvasEl.getContext('2d');
    this.image = this.ctx.createImageData(SCREEN_W, SCREEN_H);
    this.input = new Input();
    this.synth = new Synth();
    this.audio = null;
    this.screenshots = 0;
    this.game = new Game(this.input, this.synth);
  }

  init() {
    window.addEventListener('keydown', e => this.onKeyDown(e));
    window.addEventListener('keyup', e => {
      const key = mapKey(e.code);
      if (key !== null) { this.input.release(key); e.preventDefault(); }
    });
    window.addEventListener('blur', () => this.input.releaseAll());
    window.addEventListener('resize', () => this.fitToWindow());
    document.addEventListener('fullscreenchange', () => this.fitToWindow());
    this.fitToWindow();
  }

  // Largest whole-number scale that fits the window: crisp pixels
  fitToWindow() {
    const scale = Math.max(1, Math.floor(Math.min(window.innerWidth / SCREEN_W, window.innerHeight / SCREEN_H)));
    this.el.style.width = SCREEN_W * scale + 'px';
    this.el.style.height = SCREEN_H * scale + 'px';
  }

  // Browsers only allow sound after a key press, so the device opens on the first one.
  startAudio() {
    if (this.audio) {
      if (this.audio.state === 'suspended') this.audio.resume();
      return;
    }
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.audio = new AudioCtx();
      const node = this.audio.createScriptProcessor(1024, 1, 1);
      node.onaudioprocess = e => {
        const out = e.outputBuffer.getChannelData(0);
        this.synth.render(out, out.length, this.audio.sampleRate);
      };
      node.connect(this.audio.destination);
      this.audioNode = node;  // keep a reference so it isn't garbage-collected
    } catch (err) {
      console.warn('No audio:', err);  // the game still runs, silently
    }
  }

  onKeyDown(e) {
    this.startAudio();
    if (e.code === 'F11') { e.preventDefault(); if (!e.repeat) this.toggleFullscreen(); return; }
    if (e.code === 'F12') { e.preventDefault(); if (!e.repeat) this.saveScreenshot(); return; }
    const key = mapKey(e.code);
    if (key === null) return;
    e.preventDefault();  // arrows must not scroll the page
    if (!e.repeat) this.input.press(key);
  }

  toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  saveScreenshot() {
    const a = document.createElement('a');
    a.download = 'screenshot_' + String(this.screenshots++).padStart(3, '0') + '.png';
    a.href = this.el.toDataURL('image/png');
    a.click();
  }

  run() {
    let last = performance.now();
    let accumulator = 0;
    const frame = now => {
      // Fixed timestep: the game always advances in 1/60 s steps,
      // no matter how fast the monitor refreshes.
      accumulator += Math.min(0.25, (now - last) / 1000);
      last = now;
      while (accumulator >= STEP_SECONDS) {
        this.game.step();
        this.input.endStep();
        accumulator -= STEP_SECONDS;
      }
      this.game.render(this.image.data);
      this.ctx.putImageData(this.image, 0, 0);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
}

// =============================================================================
// main
// =============================================================================

Promise.all([loadSprite(ASSET_PNG.player), loadSprite(ASSET_PNG.bossRoom), loadSprite(ASSET_PNG.bossFace)])
  .then(([player, bossRoom, bossFace]) => {
    ASSETS.player = player;
    ASSETS.bossRoom = bossRoom;
    ASSETS.bossFace = bossFace;
    const app = new WebApp(document.getElementById('screen'));
    app.init();
    app.run();
  })
  .catch(err => console.error(err));
</script>
